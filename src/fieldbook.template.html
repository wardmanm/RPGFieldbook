<!DOCTYPE html>
<html lang="en" data-theme="light" data-skin="humblewood" data-rough="on" data-tabs="labels">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fieldbook — Humblewood Character Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700;900&family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/*@@CSS@@*/
</style>
</head>
<body>
<!-- rough-ink SVG filter -->
<svg width="0" height="0" aria-hidden="true" style="position:absolute"><filter id="rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.013 0.016" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.4" xChannelSelector="R" yChannelSelector="G"/></filter></svg>

<div class="topbar">
  <div class="wordmark"><span id="wmMain">Humblewood</span><small id="wmSub">The Fieldbook</small></div>
  <button class="verbtn" id="btnVer" title="Version & changelog">v—</button>
  <button class="updpill" id="updatePill" style="display:none"></button>
  <span id="savestate" class="savestate"></span>
  <button class="tbtn" id="btnHome" title="Characters / home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 9v11a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9"/></svg></button>
  <button class="tbtn" id="btnTheme" title="Toggle light / dark">
    <svg viewBox="0 0 24 24" id="themeIcon"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
  </button>
  <button class="tbtn" id="btnSettings" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 6.6 19l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3 13.4H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 6.6l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 10 4.6V4a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8v.2a1.6 1.6 0 0 0 1.4 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg></button>
  <button class="tbtn" id="btnPrint" title="Print / save PDF of the sheet"><svg viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2M6 14h12v7H6z"/></svg></button>
  <button class="tbtn" id="btnLoad"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>Load</button>
  <button class="tbtn primary" id="btnSave"><svg viewBox="0 0 24 24"><path d="M12 21V9m0 12 4-4m-4 4-4-4M4 7V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2"/></svg>Save</button>
  <input type="file" id="fileLoad" accept="application/json,.json" class="hidefile">
</div>

<div class="tabbar">
  <!-- Each tab carries both a glyph and its word; CSS shows one or the other.
       No <title> inside these SVGs — buildToc() reads the button's textContent
       for the flyout heading and a title would concatenate into it. -->
  <button class="tab active" data-tab="sheet" aria-label="Sheet"><svg class="tabicon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.4"/><path d="M5.5 20a6.5 6.5 0 0 1 13 0"/></svg><span class="tlbl">Sheet</span></button>
  <button class="tab" data-tab="spells" aria-label="Spells"><svg class="tabicon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 3l1.7 4.3L17 9l-4.3 1.7L11 15l-1.7-4.3L5 9l4.3-1.7z"/><path d="M18 15.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></svg><span class="tlbl">Spells</span></button>
  <button class="tab" data-tab="inventory" aria-label="Inventory"><svg class="tabicon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7.5l9-4.5 9 4.5v9l-9 4.5-9-4.5z"/><path d="M3 7.5l9 4.5 9-4.5M12 12v9"/></svg><span class="tlbl">Inventory</span></button>
  <button class="tab" data-tab="story" aria-label="Story"><svg class="tabicon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5.5A2.5 2.5 0 0 1 5.5 3H11v16H5.5A2.5 2.5 0 0 0 3 21z"/><path d="M21 5.5A2.5 2.5 0 0 0 18.5 3H13v16h5.5A2.5 2.5 0 0 1 21 21z"/></svg><span class="tlbl">Story</span></button>
  <button class="tab" data-tab="notes" aria-label="Notes"><svg class="tabicon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg><span class="tlbl">Notes</span></button>
  <button class="tab" data-tab="rules" aria-label="Rules"><svg class="tabicon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/><path d="M9 8h6"/></svg><span class="tlbl">Rules</span></button>
  <button class="tab-toc" id="btnToc" title="Jump to a section" aria-label="Table of contents">☰</button>
</div>
<div class="toc-back" id="tocBack"></div>
<nav class="toc-fly" id="tocFly" aria-label="Sections"></nav>

<div class="page">
<!--@@HTML@@-->
</div>

<!-- generic modal -->
<div class="home" id="home" style="display:none">
  <div class="home-inner">
    <div class="home-head">
      <div class="wordmark"><span id="homeWmMain">Fieldbook</span><small id="homeWmSub">Character Library</small></div>
      <button class="tbtn" id="homeBack" style="display:none"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>Back to sheet</button>
      <button class="tbtn" id="homeCog" title="Setup"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 6.6 19l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3 13.4H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 6.6l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 10 4.6V4a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8v.2a1.6 1.6 0 0 0 1.4 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg></button>
    </div>

    <div class="home-setup" id="homeSetup">
      <div class="card">
        <div class="label">Appearance</div>
        <div class="g2">
          <div class="field"><label class="f">Skin</label><div class="seg" id="homeSkin"><button type="button" data-skin="humblewood">Humblewood</button><button type="button" data-skin="classic">Classic D&amp;D</button></div></div>
          <div class="field"><label class="f">Mode</label><div class="seg" id="homeMode"><button type="button" data-th="system">System</button><button type="button" data-th="light">Light</button><button type="button" data-th="dark">Dark</button></div></div>
        </div>
        <label class="equip" id="homeRough" style="margin-top:8px"><span class="box"></span>Hand-drawn borders</label>
      </div>
      <div class="card">
        <div class="label">Rules data</div>
        <p class="hint" id="homeRulesStatus" style="margin-bottom:8px"></p>
        <button class="tbtn primary" id="homeImportBtn"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>Import rules files (bulk)</button>
        <input type="file" id="homeRulesFiles" accept="application/json,.json" multiple class="hidefile">
        <p class="hint" style="margin-top:8px">Select multiple JSON files at once — races, classes, spells, feats, backgrounds, subclasses, and glossary all merge together.</p>
        <div class="f" style="margin-top:10px">Loaded data</div>
        <div id="homeRulesData"></div>
        <div class="m-actions" style="justify-content:flex-end;margin-top:8px"><button class="tbtn danger" id="homeClearRules">Clear all</button></div>
      </div>
    </div>

    <div class="card">
      <div class="label">Your characters <span class="grow"></span><button class="add sub" id="homeLoadChar" title="Import a character from a Fieldbook .json file"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>Import</button><button class="add" id="homeNew"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New character</button></div>
      <div id="homeChars"></div>
    </div>
  </div>
</div>
<div class="backdrop" id="modal"><div class="modal" role="dialog" aria-modal="true">
  <div class="m-head"><span class="m-icon" id="mIcon"></span><div class="m-title" id="mTitle"></div><button class="close" id="mClose" aria-label="Close">×</button></div>
  <div class="m-body" id="mBody"></div>
</div></div>

<script>
//@@JS@@
</script>
<div id="printArea" aria-hidden="true"></div>
</body>
</html>
