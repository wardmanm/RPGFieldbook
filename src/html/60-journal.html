  <!-- ============ JOURNAL TAB ============ -->
  <!-- The player's own journal pages (87-journal.js), their trackers
       (87-trackers.js), then the section notes gathered from every other tab
       (87-notes.js). Only Trackers takes a section note (see it). -->
  <section class="tabpanel" id="tab-journal">
    <div class="stack" style="max-width:820px;margin:0 auto">
      <div class="card" id="journalCard">
        <div class="label">Journal <button class="add" id="jnlNew"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Page</button><span class="grow"></span></div>
        <!-- the search belongs to the list: renderJournal() hides it on a page -->
        <div id="jnlListBar"><div class="searchbox" style="margin-bottom:10px"><input id="jnlSearch" placeholder="Search your pages…" autocomplete="off"><button type="button" class="search-clear" aria-label="Clear the search" title="Clear">×</button></div></div>
        <div id="jnlBody"></div>
      </div>
      <!-- The one card on this tab that takes a section note: registering it is what lets it be
           added to the combat view (87-combat.js), to count mid-fight. renderTrackers() hides it
           (display:none, never removed) when Settings > This character switches it off. -->
      <div class="card" data-note="trackers" id="trackersCard">
        <div class="label">Trackers <button class="add" id="addTracker"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Tracker</button><span class="grow"></span></div>
        <div id="trkList"></div>
      </div>
      <div class="card">
        <div class="label">Section Notes <span class="grow"></span></div>
        <p class="hint">Everything you've jotted against a section of your sheet, gathered here. Tap a heading to jump back to where it belongs.</p>
        <div id="notesList"></div>
      </div>
    </div>
  </section>
