name: Release

# Publishing is triggered by pushing an annotated tag that a LOCAL release cut
# already produced:
#
#   ./build.sh --release patch      # bumps APP_VERSION, folds in UNRELEASED.md
#   git commit -am "Release v1.2.2"
#   git tag -a v1.2.2 -m "v1.2.2" && git push && git push --tags
#
# The version decision, the changelog wording and the artifact all stay under
# your eye locally; this workflow only PUBLISHES, and refuses to publish
# anything it cannot independently reproduce from source.
#
# Assets: fieldbook.html, the app zip, the rules-data archive
# fieldbook-data-standalone-X.Y.Z.zip, and the data kit fieldbook-data-kit-X.Y.Z.zip.
# Data-only releases are data-release.yml.
#
# workflow_dispatch re-publishes an existing tag — for when an upload failed and
# the release needs rebuilding, without cutting a new version.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v1.2.2"
        required: true
        type: string

permissions:
  contents: write        # create the release and upload assets

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$TAG' is not a vX.Y.Z tag"; exit 1 ;;
          esac
          echo "tag=$TAG"            >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}"    >> "$GITHUB_OUTPUT"

      # fetch-depth: 0 is no longer strictly required — the source zip that
      # needed `git ls-files` is gone, and the two things that still use git
      # (build-html.js's clobber guard via `git show HEAD:…`, and the
      # reproducibility `git diff`) both work at depth 1. Kept because it costs
      # seconds on a repo this size and a full checkout can't surprise us.
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The tag is a claim about the source. Check it before building anything:
      # tagging without cutting the release is the easy mistake, and it would
      # otherwise ship a bundle whose in-app version disagrees with its filename.
      - name: Verify the tag matches APP_VERSION
        run: |
          SRC=$(grep -oE 'APP_VERSION="[^"]+"' src/js/30-version.js | head -1 | cut -d'"' -f2)
          echo "tag=${{ steps.tag.outputs.version }}  src/js/30-version.js=$SRC"
          if [ "$SRC" != "${{ steps.tag.outputs.version }}" ]; then
            echo "::error::tag v${{ steps.tag.outputs.version }} but APP_VERSION is $SRC."
            echo "::error::Cut the release first: ./build.sh --release <level>"
            exit 1
          fi

      # release.js records every pack's version in data/packs.json and sets its
      # release to the app version (#83). A tag cut without it would publish an
      # archive named for the previous release.
      - name: Verify data/packs.json is released at this tag
        run: |
          REL=$(node -e 'process.stdout.write(String(require("./data/packs.json").release||""))')
          echo "tag=${{ steps.tag.outputs.version }}  data/packs.json release=$REL"
          if [ "$REL" != "${{ steps.tag.outputs.version }}" ]; then
            echo "::error::data/packs.json's release is $REL, not ${{ steps.tag.outputs.version }}."
            echo "::error::Cut the release with ./build.sh --release <level>, which records the data versions."
            exit 1
          fi

      # A data change committed AFTER --release ran (or a hand-edit of data/)
      # leaves the release named for digests that no longer match. Without
      # this, build.sh would silently name the archive "+dev" and the job
      # would die three steps later at "missing or empty asset" with no clue
      # why (data-release.yml has carried this same guard since #83).
      - name: Verify the recorded digests are current
        run: |
          python3 --version
          if ! python3 tools/data-kit/fbdata.py versions --check; then
            echo "::error::A pack changed after the release was cut — re-run ./build.sh --release or revert the data change."
            exit 1
          fi

      # Pending notes at a release tag mean the tag was not cut with --release:
      # those bullets are missing from the changelog, so the release notes would
      # be incomplete. It also makes build.sh name the zips "+dev", which would
      # otherwise surface later as a baffling "missing asset" failure.
      - name: Refuse a tag with unreleased notes
        run: |
          N=$(sed -n '/^## Pending/,$p' src/docs/UNRELEASED.md | grep -c '^- ' || true)
          if [ "$N" -gt 0 ]; then
            echo "::error::$N unreleased note(s) still in src/docs/UNRELEASED.md at this tag."
            echo "::error::They are missing from the changelog, so these release notes would be incomplete."
            echo "::error::Cut the tag with ./build.sh --release <level>, which folds them in and empties the notebook."
            sed -n '/^## Pending/,$p' src/docs/UNRELEASED.md | grep '^- ' | head -5
            exit 1
          fi
          echo "notebook is empty — the changelog is complete for this tag."

      # ci.yml only runs on pushes to main, so a tag skips it entirely. Without
      # this, the reproducibility gate below proves the artifact matches the
      # source — but nothing proves the source works.
      - name: Tests
        run: ./src/tests/run.sh

      # Build, validate and zip exactly as a local run would. The zips need
      # python3 (tools/data-kit/fbdata.py): the runner's own, named in the log.
      - name: Build
        run: |
          python3 --version
          ./build.sh

      # data-kit.py tests the kit zip itself (unzipped anywhere, it builds the
      # example pack) only once a built kit zip exists, and Tests runs before the
      # build, so there it always skips (#85). Run it again now the zip exists,
      # and fail unless those checks actually ran and passed: the kit is an asset.
      - name: The kit zip works on its own (data-kit, after the build)
        run: |
          set -o pipefail
          python3 src/tests/data-kit.py | tee "$RUNNER_TEMP/data-kit.log"
          if grep -q '^note: no dist/fieldbook-data-kit' "$RUNNER_TEMP/data-kit.log"; then
            echo "::error::data-kit.py found no kit zip after the build, so its kit checks did not run."
            exit 1
          fi
          for c in 'the kit zip holds exactly the kit' \
                   'an unzipped kit builds the example pack with no repo around it' \
                   '...and the kit finds its own convert.py'; do
            grep -Fxq "PASS  $c" "$RUNNER_TEMP/data-kit.log" \
              || { echo "::error::data-kit.py's kit check did not run or did not pass: $c"; exit 1; }
          done
          echo "the kit zip's checks ran and passed."

      # The proof that what we publish is what the source says. dist/fieldbook.html
      # is tracked, so a clean rebuild must reproduce it byte for byte; a diff here
      # means the committed artifact was hand-edited or built from other sources.
      - name: Verify the committed artifact is reproducible
        run: |
          if ! git diff --exit-code --stat -- dist/fieldbook.html; then
            echo "::error::A clean rebuild does not reproduce the committed dist/fieldbook.html."
            echo "::error::Run ./build.sh locally and commit the result before tagging."
            exit 1
          fi
          echo "dist/fieldbook.html reproduced byte-for-byte."

      - name: Verify the generated changelog is committed
        run: |
          if ! git diff --exit-code --stat -- docs/CHANGELOG.md; then
            echo "::error::docs/CHANGELOG.md is out of date with the in-app CHANGELOG array."
            exit 1
          fi

      - name: Collect release notes
        run: |
          V="${{ steps.tag.outputs.version }}"
          node scripts/release-notes.js "$V" > /tmp/notes.md
          # What to download, and which rules packs changed — from data/packs.json,
          # where release.js recorded each pack's version (#83).
          node scripts/data-release-notes.js "$V" --app >> /tmp/notes.md
          echo "Release body:"; cat /tmp/notes.md

      - name: Check the assets exist
        run: |
          V="${{ steps.tag.outputs.version }}"
          for f in dist/fieldbook.html "dist/fieldbook-v$V.zip" "dist/fieldbook-data-standalone-$V.zip" "dist/fieldbook-data-kit-$V.zip"; do
            [ -s "$f" ] || { echo "::error::missing or empty asset: $f"; exit 1; }
            printf '  %-46s %s\n' "$f" "$(du -h "$f" | cut -f1)"
          done

      # R13: a public release may only ever carry packs under an allowlisted
      # licence, and never an asset meant for the private repo alone.
      - name: Public assets only
        run: |
          V="${{ steps.tag.outputs.version }}"
          python3 tools/data-kit/fbdata.py validate --public "dist/fieldbook-data-standalone-$V.zip" || {
            echo "::error::The rules-data archive holds a pack a public release may not carry."; exit 1; }
          for f in dist/fieldbook.html "dist/fieldbook-v$V.zip" "dist/fieldbook-data-standalone-$V.zip" "dist/fieldbook-data-kit-$V.zip"; do
            case "$f" in *private*) echo "::error::refusing to publish $f"; exit 1 ;; esac
          done
          if unzip -Z1 "dist/fieldbook-v$V.zip" | grep -qi private; then
            echo "::error::the app zip names something private"; exit 1
          fi

      # `gh` ships on the runner, so this needs no third-party action — one less
      # supply-chain dependency to pin and audit for something that publishes.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.tag.outputs.version }}"
          TAG="${{ steps.tag.outputs.tag }}"
          # No source archive here: GitHub attaches "Source code (zip)" and
          # "(tar.gz)" to every release itself, from the tag.
          ASSETS=(dist/fieldbook.html
                  "dist/fieldbook-v$V.zip"
                  "dist/fieldbook-data-standalone-$V.zip"
                  "dist/fieldbook-data-kit-$V.zip")
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — updating notes and re-uploading assets."
            gh release edit "$TAG" --title "Fieldbook $TAG" --notes-file /tmp/notes.md
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "Fieldbook $TAG" --notes-file /tmp/notes.md
          fi
          echo "Published: $(gh release view "$TAG" --json url -q .url)"
